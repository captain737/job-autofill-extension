<body><div id="app"></div>
<script>
// A tiny Workday-like single-page app. window.__clicks records every button pressed.
window.__clicks = [];
const ACC = () => JSON.parse(localStorage.getItem('acc') || 'null');
const app = document.getElementById('app');
const go = (step) => { history.pushState({}, '', '?step=' + step); render(); };
const snap = () => (window.__snap = window.__snap || []).push([...document.querySelectorAll('input:not([type=password]):not([type=checkbox]),textarea,button[aria-haspopup]')].map((i) => (i.name || i.id) + '=' + (i.type === 'file' ? (i.files[0] || {}).name : (i.value || i.textContent))));
const btn = (text, fn, attrs = '') => { const id = 'x' + Math.random().toString(36).slice(2); setTimeout(() => { const b = document.getElementById(id); if (b) b.addEventListener('click', (e) => { e.preventDefault(); __clicks.push(text); snap(); fn(); }); }); return `<button type="button" id="${id}" ${attrs}>${text}</button>`; };
function render() {
  const step = new URLSearchParams(location.search).get('step') || 'posting';
  if (step === 'posting') {
    app.innerHTML = `<h1>Data Engineer</h1><p>Acme · San Francisco, CA</p><div class="job-description"><h3>About the role</h3><p>${'Build pipelines in Python and Airflow. '.repeat(30)}</p><h3>Requirements</h3><p>5+ years, Spark, AWS.</p></div>${btn('Apply', () => { app.insertAdjacentHTML('beforeend', `<div class="modal" role="dialog"><h2>Start Your Application</h2>${btn('Autofill with Resume', () => go('parsed'))} ${btn('Apply Manually', () => go('signin'))} ${btn('Use My Last Application', () => go('signin'))}</div>`); })}`;
  } else if (step === 'signin') {
    app.innerHTML = `<h2>Sign In</h2><form><label>Email Address <input type="email" id="em"></label><label>Password <input type="password" id="pw"></label><div class="err" role="alert" id="er"></div>${btn('Sign In', () => {
      const a = ACC(); if (a && a.email === em.value && a.pw === pw.value) go('info'); else document.getElementById('er').textContent = 'Wrong email or password.'; })}</form><p>Don't have an account? ${btn('Create Account', () => go('create'))}</p>`;
  } else if (step === 'create') {
    app.innerHTML = `<h2>Create Account</h2><form><label>Email Address* <input type="email" id="em" required></label><label>Password* <input type="password" id="pw" required></label><label>Verify New Password* <input type="password" id="pw2" required></label>
      <label><input type="checkbox" id="agree" required> Yes, I have read and consent to the Terms and Conditions*</label><div class="err" role="alert" id="er"></div>${btn('Create Account', () => {
      const ok = pw.value.length >= 12 && pw.value === pw2.value && /[A-Z]/.test(pw.value) && /[^A-Za-z0-9]/.test(pw.value);
      if (!agree.checked) return (document.getElementById('er').textContent = 'You must agree to the terms.');
      if (!ok) return (document.getElementById('er').textContent = 'Password does not meet requirements.');
      localStorage.setItem('acc', JSON.stringify({ email: em.value, pw: pw.value })); go('signin'); })}</form>`;
  } else if (step === 'info') {
    app.innerHTML = `<h2>My Information</h2><label>First Name* <input id="fn" required value="ALEX RIVERA"></label><label>Last Name* <input id="ln" required value=""></label><label>Email* <input id="emx" required value="alex@example.com"></label><label>Country* <select id="cty" required><option value="">Select One</option><option>Afghanistan</option><option>Albania</option><option>Algeria</option><option>Andorra</option><option>Angola</option><option>Argentina</option><option>Armenia</option><option>Australia</option><option>Austria</option><option>Azerbaijan</option><option>Bahamas</option><option>Bahrain</option><option>Bangladesh</option><option>Barbados</option><option>Belarus</option><option>Belgium</option><option>Belize</option><option>Benin</option><option>Bhutan</option><option>Bolivia</option><option>Bosnia and Herzegovina</option><option>Botswana</option><option>Brazil</option><option>Brunei</option><option>Bulgaria</option><option>Burkina Faso</option><option>Burundi</option><option>Cambodia</option><option>Cameroon</option><option>Canada</option><option>Chad</option><option>Chile</option><option>China</option><option>Colombia</option><option>Comoros</option><option>Congo</option><option>Costa Rica</option><option>Croatia</option><option>Cuba</option><option>Cyprus</option><option>Czechia</option><option>Denmark</option><option>Djibouti</option><option>Dominica</option><option>Dominican Republic</option><option>Ecuador</option><option>Egypt</option><option>El Salvador</option><option>Estonia</option><option>Eswatini</option><option>Ethiopia</option><option>Fiji</option><option>Finland</option><option>France</option><option>Gabon</option><option>Gambia</option><option>Georgia</option><option>Germany</option><option>Ghana</option><option>Greece</option><option>Grenada</option><option>Guatemala</option><option>Guinea</option><option>Guyana</option><option>Haiti</option><option>Honduras</option><option>Hungary</option><option>Iceland</option><option>India</option><option>Indonesia</option><option>Iran</option><option>Iraq</option><option>Ireland</option><option>Israel</option><option>Italy</option><option>Jamaica</option><option>Japan</option><option>Jordan</option><option>Kazakhstan</option><option>Kenya</option><option>Kuwait</option><option>Laos</option><option>Latvia</option><option>Lebanon</option><option>Lesotho</option><option>Liberia</option><option>Libya</option><option>Lithuania</option><option>Luxembourg</option><option>Madagascar</option><option>Malawi</option><option>Malaysia</option><option>Maldives</option><option>Mali</option><option>Malta</option><option>Mexico</option><option>Moldova</option><option>Monaco</option><option>Mongolia</option><option>Montenegro</option><option>Morocco</option><option>Mozambique</option><option>Myanmar</option><option>Namibia</option><option>Nepal</option><option>Netherlands</option><option>New Zealand</option><option>Nicaragua</option><option>Niger</option><option>Nigeria</option><option>Norway</option><option>Oman</option><option>Pakistan</option><option>Panama</option><option>Paraguay</option><option>Peru</option><option>Philippines</option><option>Poland</option><option>Portugal</option><option>Qatar</option><option>Romania</option><option>Russia</option><option>Rwanda</option><option>Saudi Arabia</option><option>Senegal</option><option>Serbia</option><option>Singapore</option><option>Slovakia</option><option>Slovenia</option><option>Somalia</option><option>South Africa</option><option>South Korea</option><option>Spain</option><option>Sri Lanka</option><option>Sudan</option><option>Sweden</option><option>Switzerland</option><option>Syria</option><option>Taiwan</option><option>Tanzania</option><option>Thailand</option><option>Togo</option><option>Tunisia</option><option>Turkey</option><option>Uganda</option><option>Ukraine</option><option>United Arab Emirates</option><option>United Kingdom</option><option>United States of America</option><option>Uruguay</option><option>Uzbekistan</option><option>Venezuela</option><option>Vietnam</option><option>Yemen</option><option>Zambia</option><option>Zimbabwe</option></select></label><label>Phone Number* <input id="ph" required value="415"></label>
      <div><label id="lh">How Did You Hear About Us?*</label><button type="button" aria-haspopup="listbox" aria-labelledby="lh" id="hear">Select One</button></div><div id="pop"></div>${btn('Save and Continue', () => { if (!fn.value || !ln.value || !cty.value || hear.textContent === 'Select One') return; go('exp'); })}`;
    hear.addEventListener('click', () => { pop.innerHTML = '<ul role="listbox">' + ['LinkedIn', 'Indeed', 'Referral'].map((o) => `<li role="option">${o}</li>`).join('') + '</ul>'; pop.querySelectorAll('li').forEach((li) => li.addEventListener('click', () => { hear.textContent = li.textContent; pop.innerHTML = ''; })); });
  } else if (step === 'exp') {
    // Pre-filled the way a bad résumé parser would: swapped title/company, merged description.
    app.innerHTML = `<h2>My Experience</h2><section><h3>Work Experience</h3><div id="we"><div class="entry"><h4>Work Experience 1</h4><label>Job Title* <input name="t1" value="Acme Corp"></label><label>Company* <input name="c1" value="Software Engineer"></label><label>Role Description <textarea name="d1">Software Engineer Acme Corp 2022 Built 40+ Airflow DAGs Globex Data Intern Wrote Python ingestion</textarea></label></div></div>${btn('Add Another', () => { we.insertAdjacentHTML('beforeend', `<div class="entry"><h4>Work Experience 2</h4><label>Job Title* <input name="t2"></label><label>Company* <input name="c2"></label><label>Role Description <textarea name="d2"></textarea></label></div>`); })}</section>
      <section><h3>Resume</h3><label>Resume/CV* <input type="file" id="cv"></label></section>${btn('Save and Continue', () => { if (!document.querySelector('[name=t2]') || !cv.files.length) return; go('review'); })}`;
  } else if (step === 'review') {
    app.innerHTML = `<h2>Review</h2><p>Please review your application before submitting.</p>${btn('Submit', () => go('done'))}`;
  } else if (step === 'done') {
    app.innerHTML = '<h2>Application submitted</h2><p>Thanks for applying!</p>';
  } else if (step === 'parsed') {
    app.innerHTML = '<h2>Workday parsed your resume (wrongly)</h2>';
  }
}
addEventListener('popstate', render);
render();
</script></body></html>
