<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 290px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; color: #111827; }
    h1 { font-size: 16px; margin: 0 0 12px; color: #4f46e5; }
    button { width: 100%; padding: 10px; font: 600 14px system-ui; border-radius: 8px; cursor: pointer; margin-bottom: 8px; }
    .primary { color: #fff; background: #4f46e5; border: 0; }
    .primary:hover { background: #4338ca; }
    .secondary { color: #4f46e5; background: #fff; border: 1px solid #c7d2fe; }
    .secondary:hover { background: #eef2ff; }
    #status { margin: 4px 0 8px; min-height: 18px; color: #4b5563; white-space: pre-line; font-size: 13px; }
    label { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: #374151; font-size: 13px; }
    .muted { color: #6b7280; font-size: 12px; }
    .links { display: flex; justify-content: space-between; margin-top: 10px; }
    a { color: #4f46e5; font-size: 13px; }
  </style>
</head>
<body>
  <h1>⚡ Fillup</h1>
  <button class="primary" id="open">Open sidebar on this page</button>
  <button class="secondary" id="fill">Autofill this page now</button>
  <div id="status"></div>
  <label><input type="checkbox" id="auto"> Auto-fill on <span id="host">this site</span></label>
  <p class="muted" id="counts"></p>
  <p class="muted" id="shortcut"></p>
  <div class="links"><a href="#" id="tracker">Tracker</a><a href="#" id="profile">Profile &amp; settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
